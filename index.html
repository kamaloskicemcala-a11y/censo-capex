<style>
:root{--bg:#f6f1d8;--card:#fffdf3;--ink:#14213d;--mut:#5b6478;--line:#ddd5b0;--acc:#1c3663;--accd:#1c3663;--ok:#22803a;--warn:#c76a00;--bad:#c22b2b;--gr:#8a93a6}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px 14px 90px}
h1,h2,.sl{font-family:Rockwell,"Roboto Slab","Rockwell Extra Bold",Cambria,Georgia,serif;font-weight:800;text-transform:uppercase;letter-spacing:.01em}h1{font-size:1.45rem;margin:.2em 0 .1em}h2{font-size:1.1rem;margin:0}
header.brand{background:var(--bg);text-align:center;padding:calc(8px + env(safe-area-inset-top)) 0 8px;border-bottom:4px solid var(--acc);position:sticky;top:0;z-index:4}header.brand img{height:58px;display:inline-block}body.big header.brand img{height:150px}
.card{border:1px solid var(--line)}button{letter-spacing:.02em}
.mut{color:var(--mut);font-size:.875rem}
input,select,textarea{width:100%;font:inherit;padding:13px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:6px 0 12px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
label{font-weight:650;font-size:.9rem}
button{font:inherit;font-weight:650;border:0;border-radius:12px;padding:14px 16px;background:var(--acc);color:#fff;width:100%;cursor:pointer}
button.sec{background:transparent;color:var(--accd);border:2px solid var(--line)}
button.sm{width:auto;padding:9px 14px;font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.tabs,.chips{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.chip{width:auto;padding:8px 13px;font-size:.85rem;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border-radius:12px;padding:13px 14px;margin:9px 0;border-left:8px solid var(--gr);cursor:pointer}
.card.NOC{border-color:var(--bad)}.card.PROC{border-color:var(--warn)}.card.CEN{border-color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--ok)}
.b{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;background:var(--gr);white-space:nowrap}
.b.OK,.b.CEN{background:var(--ok)}.b.SERIE_DISTINTA,.b.PROC,.b.SIN_CONFIRMAR{background:var(--warn)}.b.NO_TIENE,.b.NOC{background:var(--bad)}
.b.w{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.h{cursor:default;border-left-width:8px}.h.OK{border-color:var(--ok)}.h.SERIE_DISTINTA,.h.SIN_CONFIRMAR{border-color:var(--warn)}.h.NO_TIENE{border-color:var(--bad)}
.det{font-size:.85rem;color:var(--mut);margin-top:6px;word-break:break-word}
.sheet{position:fixed;inset:0;background:rgba(3,15,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.opt{display:grid;gap:8px;margin:10px 0}
.opt button{background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left;font-size:1.05rem}
.opt button.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:var(--ink);color:var(--bg);padding:13px 15px;border-radius:12px;z-index:9;display:none;font-weight:600}
.pend{background:var(--warn);color:#fff;border-radius:10px;padding:9px 12px;margin:8px 0;font-weight:650;font-size:.9rem}
.err{color:var(--bad);font-weight:650;min-height:1.3em}

<script>
// >>> COMPLETAR con los datos de Supabase (Project Settings > API) <<<
let SUPABASE_URL='https://pfttexkjsaiekbcktnzc.supabase.co', SUPABASE_KEY='sb_publishable_thVLVy4PiHqAYP5jSfHi0Q_Tlmh-0Hs';

const $=s=>document.querySelector(s), app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const S={acc:ls('acc',''),pid:ls('pid',0),pname:ls('pname',''),pin:sessionStorage.pin||'',scope:'mine',filt:'',q:'',list:[],motivos:ls('motivos',[])};
let Q=ls('queue',[]), flushing=false, tt;
const noCfg=()=>SUPABASE_URL.startsWith('PEGAR');
if(noCfg()){const c=ls('cfg',null);if(c){SUPABASE_URL=c.url;SUPABASE_KEY=c.key}}
function brand(b){document.body.classList.toggle("big",b)}
function setup(){brand(1);
  app.innerHTML=`<h1>Conectar con la base</h1><p class="mut">Pegá los datos de Supabase (Project Settings &gt; API). Usá la clave anon / publishable, nunca la service_role.</p>
  <label for="u">Project URL</label><input id="u" placeholder="https://xxxx.supabase.co" autocapitalize="off" value="${esc(noCfg()?'':SUPABASE_URL)}">
  <label for="k">Clave anon public</label><input id="k" autocapitalize="off" autocomplete="off"><div class="err" id="e"></div><button id="go">Guardar y continuar</button>`;
  $('#go').onclick=()=>{const u=$('#u').value.trim().replace(/\/+$/,''),k=$('#k').value.trim();
    if(!/^https:\/\/.+\..+/.test(u)||k.length<20)return $('#e').textContent='Revisá la URL y la clave';
    sv('cfg',{url:u,key:k});SUPABASE_URL=u;SUPABASE_KEY=k;login()}}

const ERR={ACCESO_INVALIDO:'Código de acceso incorrecto',PIN_INVALIDO:'PIN incorrecto',PROMOTOR_INVALIDO:'Promotor no válido',
FALTA_SERIE_FISICA:'Falta la serie de la heladera',FALTA_NRO_ACTIVO:'Falta el N° de activo',FALTA_MOTIVO:'Elegí un motivo',
FALTA_OBSERVACION:'Con "Otro" hay que escribir una observación'};
const ALERTA={SERIE_FISICA_SOSPECHOSA:'La serie parece incompleta o repetida: revisala.',
SERIE_EN_OTRA_HELADERA_DE_LA_BASE:'Esa serie figura en otra heladera de la base.',
SERIE_YA_CARGADA_EN_OTRA_HELADERA:'Esa serie ya se cargó en otra heladera.',
ACTIVO_YA_CARGADO_EN_OTRA_HELADERA:'Ese N° de activo ya se cargó en otra heladera.',
YA_CARGADA_COMO_NO_REGISTRADA:'Ya se cargó como heladera no registrada.',SERIE_YA_EXISTE_EN_LA_BASE:'Esa serie ya existe en la base.',
YA_CARGADA_EN_UNA_VERIFICACION:'Ya se cargó en otra verificación.'};
const RES={OK:'OK',SERIE_DISTINTA:'Serie distinta',SIN_CONFIRMAR:'Sin confirmar',NO_TIENE:'No tiene',NO_VERIFICABLE:'No se pudo verificar',PENDIENTE:'Pendiente'};
const EST={'NO CENSADO':'NOC','EN PROCESO':'PROC','CENSADO':'CEN'};

function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',ms)}
async function rpc(fn,args){
  const h={apikey:SUPABASE_KEY,'Content-Type':'application/json'};
  if(SUPABASE_KEY.startsWith('eyJ'))h.Authorization='Bearer '+SUPABASE_KEY;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:h,body:JSON.stringify(args)});
  const j=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error((j&&j.message)||'ERROR');e.biz=true;throw e}
  return j}
const net=e=>!e.biz;
function fail(e){if(e.message==='ACCESO_INVALIDO'){logout(true);return}toast(net(e)?'Sin conexión. Probá de nuevo cuando tengas señal.':(ERR[e.message]||'Error: '+e.message))}

// Cola: si no hay señal, la verificación queda en el celular y se envía sola
async function send(fn,args){
  try{return await rpc(fn,args)}
  catch(e){if(net(e)){Q.push({fn,args});sv('queue',Q);toast('Sin señal: guardado en el celular, se envía solo.');return {queued:true}}throw e}}
async function flush(){
  if(flushing||!Q.length)return;flushing=true;
  while(Q.length){try{await rpc(Q[0].fn,Q[0].args);Q.shift();sv('queue',Q)}
    catch(e){if(net(e))break;toast('Un registro pendiente fue rechazado: '+(ERR[e.message]||e.message),6000);Q.shift();sv('queue',Q)}}
  flushing=false;if(!Q.length&&S.view==='list')loadList()}
addEventListener('online',flush);setInterval(flush,30000);

function logout(bad){['acc','pid','pname'].forEach(k=>localStorage.removeItem(k));sessionStorage.removeItem('pin');S.acc='';S.pid=0;
  if(bad)toast('El código de acceso cambió. Ingresalo de nuevo.');login()}

// ---------- Login ----------
function login(step=1,proms=[]){
  S.view='login';brand(1);
  if(step===1){app.innerHTML=`<h1>Censo de heladeras</h1><p class="mut">Ingresá el código del equipo.</p>
  <label for="c">Código de acceso</label><input id="c" type="password" autocomplete="off"><div class="err" id="e"></div><button id="go">Continuar</button>`;
    $('#go').onclick=async()=>{const c=$('#c').value.trim();try{const p=await rpc('app_promotores',{p_acceso:c});S.acc=c;login(2,p)}
      catch(e){$('#e').textContent=net(e)?'Sin conexión':(ERR[e.message]||e.message)}}}
  else{app.innerHTML=`<h1>¿Quién sos?</h1><label for="p">Tu nombre</label><select id="p"><option value="">Elegí tu nombre…</option>
  ${proms.map(p=>`<option value="${p.id}" data-pin="${p.requiere_pin}">${esc(p.nombre)}</option>`).join('')}</select>
  <div id="pinw" hidden><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric"></div>
  <div class="err" id="e"></div><button id="go">Entrar</button>`;
    $('#p').onchange=e=>{$('#pinw').hidden=e.target.selectedOptions[0].dataset.pin!=='true'};
    $('#go').onclick=()=>{const o=$('#p').selectedOptions[0];if(!o.value){$('#e').textContent='Elegí tu nombre';return}
      S.pid=+o.value;S.pname=o.textContent;S.pin=$('#pin').value;sessionStorage.pin=S.pin;
      sv('acc',S.acc);sv('pid',S.pid);sv('pname',S.pname);home()}}}

// ---------- Lista de PDV ----------
async function home(){S.view='list';brand(0);S.q='';S.filt='';S.scope='mine';S.motivos.length||rpc('app_motivos',{p_acceso:S.acc}).then(m=>{S.motivos=m;sv('motivos',m)}).catch(()=>{});
  drawList();loadList();flush()}
async function loadList(){
  if(S.scope==='all'&&S.q.trim().length<2){S.list=[];return drawItems()}
  try{S.list=await rpc('app_lista_pdv',{p_acceso:S.acc,p_promotor_id:S.scope==='mine'?S.pid:null,p_buscar:S.scope==='all'?S.q.trim():null});sv('lista_'+S.pid,S.list)}
  catch(e){if(net(e)&&S.scope==='mine')S.list=ls('lista_'+S.pid,[]);else return fail(e)}
  drawItems()}
function drawList(){
  app.innerHTML=`<div class="top"><div><h1>${esc(S.pname)}</h1><span class="mut">Mis PDV</span></div><button class="sec sm" id="sw">Cambiar</button></div>
  <div id="pq"></div>
  <div class="tabs"><button class="chip ${S.scope==='mine'?'on':''}" data-s="mine">Mis PDV</button><button class="chip ${S.scope==='all'?'on':''}" data-s="all">Buscar en toda la base</button></div>
  <input id="q" type="search" placeholder="Nombre o código de cliente" value="${esc(S.q)}">
  <div class="chips">${['','NO CENSADO','EN PROCESO','CENSADO'].map(f=>`<button class="chip ${S.filt===f?'on':''}" data-f="${f}">${f||'Todos'}</button>`).join('')}</div>
  <div id="items"></div>`;
  $('#sw').onclick=()=>logout();
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.s;S.q='';drawList();loadList()});
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.filt=b.dataset.f;drawList();drawItems()});
  let d;$('#q').oninput=e=>{S.q=e.target.value;clearTimeout(d);if(S.scope==='all')d=setTimeout(loadList,350);else drawItems()};
  drawItems()}
function drawItems(){
  const pq=$('#pq');if(pq)pq.innerHTML=Q.length?`<div class="pend">${Q.length} registro(s) esperando señal para enviarse</div>`:'';
  let l=S.list;const q=S.q.trim().toLowerCase();
  if(S.scope==='mine'&&q)l=l.filter(p=>p.cliente.toLowerCase().includes(q)||String(p.cod_cliente).startsWith(q));
  if(S.filt)l=l.filter(p=>p.estado===S.filt);
  const el=$('#items');if(!el)return;
  el.innerHTML=l.length?l.map(p=>`<div class="card ${EST[p.estado]}" data-c="${p.cod_cliente}"><div class="row"><div><b>${esc(p.cliente)}</b><div class="mut">Cliente ${p.cod_cliente}${S.scope==='all'?' · '+esc(p.promotor):''}</div></div><span class="b ${EST[p.estado]}">${p.estado}</span></div>
  <div class="mut" style="margin-top:6px">${p.verificadas} de ${p.total} heladeras verificadas</div></div>`).join('')
  :`<p class="mut">${S.scope==='all'&&q.length<2?'Escribí al menos 2 letras para buscar.':'No hay PDV para mostrar.'}</p>`;
  el.querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>ficha(+c.dataset.c))}

// ---------- Ficha del PDV ----------
async function ficha(cod){
  S.view='ficha';brand(0);app.innerHTML='<p class="mut">Cargando…</p>';let hs;
  try{hs=await rpc('app_ficha_pdv',{p_acceso:S.acc,p_cod_cliente:cod});sv('ficha_'+cod,hs)}catch(e){if(net(e))hs=ls('ficha_'+cod,null);if(!hs){fail(e);return home()}}
  const done=hs.filter(h=>!['PENDIENTE','NO_VERIFICABLE'].includes(h.estado)).length;
  app.innerHTML=`<button class="sec sm" id="bk">‹ Volver</button><h1>${esc(hs[0].cliente)}</h1>
  <div class="mut">Cliente ${cod} · Promotor: ${esc(hs[0].promotor_asignado)}</div>
  <div class="bar"><i style="width:${100*done/hs.length}%"></i></div><div class="mut">${done} de ${hs.length} heladeras verificadas</div>
  ${hs.map(h=>`<div class="card h ${h.estado}"><div class="row"><div><b>${esc(h.logo||h.heladera)}</b><div class="mut">${esc(h.modelo||'')}</div>
  <div class="mut">Serie en base: …${esc(String(h.serie_base).slice(-4))}</div></div><span class="b ${h.estado}">${RES[h.estado]}</span></div>
  ${h.serie_confiable?'':'<div style="margin-top:6px"><span class="b w">Serie de la base no confiable</span></div>'}
  ${h.estado==='PENDIENTE'?'':`<div class="det">${h.serie_fisica?`Serie: ${esc(h.serie_fisica)} · Activo: ${esc(h.nro_activo)}<br>`:''}${h.motivo?esc(h.motivo)+'<br>':''}${h.observacion?esc(h.observacion)+'<br>':''}${(h.alertas||[]).map(a=>'⚠ '+esc(ALERTA[a]||a)).join('<br>')}${(h.alertas||[]).length?'<br>':''}${new Date(h.fecha).toLocaleString('es-AR')} · ${esc(h.verificado_por)}</div>`}
  <button style="margin-top:10px" data-h="${h.base_id}">${h.estado==='PENDIENTE'?'Verificar':'Volver a verificar'}</button></div>`).join('')}
  <button class="sec" id="nr" style="margin-top:12px">＋ Heladera que no figura en la base</button>`;
  $('#bk').onclick=home;$('#nr').onclick=()=>hallazgo(cod,hs[0].cliente);
  app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>verif(hs.find(h=>h.base_id==b.dataset.h),cod))}

// ---------- Hoja de verificación ----------
function sheet(html){const s=document.createElement('div');s.className='sheet';s.innerHTML='<div>'+html+'</div>';document.body.appendChild(s);return s}
function verif(h,cod){
  let acc='';const s=sheet(`<h2>${esc(h.logo||h.heladera)} ${esc(h.modelo||'')}</h2><div class="mut">Serie en base: …${esc(String(h.serie_base).slice(-4))}</div>
  <div class="opt"><button data-a="ENCONTRADA">✅ Tiene la heladera</button><button data-a="NO_TIENE">❌ No tiene esa heladera</button><button data-a="NO_VERIFICABLE">🚪 No pude verificar</button></div>
  <div id="f"></div><div class="err" id="e"></div><button id="sv" hidden>Guardar</button><button class="sec" id="cx" style="margin-top:8px">Cancelar</button>`);
  $('#cx',s)&&(s.querySelector('#cx').onclick=()=>s.remove());
  s.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{acc=b.dataset.a;s.querySelectorAll('[data-a]').forEach(x=>x.classList.toggle('on',x===b));
    const mot=S.motivos.filter(m=>m.tipo===acc);
    s.querySelector('#f').innerHTML=acc==='ENCONTRADA'?`<label for="sf">Serie que ves en la heladera</label><input id="sf" autocapitalize="characters" autocomplete="off">
      <label for="na">N° de activo</label><input id="na" autocapitalize="characters" autocomplete="off">
      <label for="ob">Observación (opcional)</label><textarea id="ob" rows="2"></textarea>`
      :`<label for="mo">Motivo</label><select id="mo"><option value="">Elegí un motivo…</option>${mot.map(m=>`<option value="${m.id}">${esc(m.descripcion)}</option>`).join('')}</select>
      <label for="ob">Observación</label><textarea id="ob" rows="2"></textarea>`;
    s.querySelector('#sv').hidden=false});
  s.querySelector('#sv').onclick=async()=>{
    const v=id=>(s.querySelector(id)||{}).value||'', e=s.querySelector('#e');e.textContent='';
    if(acc==='ENCONTRADA'&&!v('#sf').trim())return e.textContent=ERR.FALTA_SERIE_FISICA;
    if(acc==='ENCONTRADA'&&!v('#na').trim())return e.textContent=ERR.FALTA_NRO_ACTIVO;
    if(acc!=='ENCONTRADA'&&!v('#mo'))return e.textContent=ERR.FALTA_MOTIVO;
    const btn=s.querySelector('#sv');btn.disabled=true;
    try{const r=await send('app_registrar',{p_acceso:S.acc,p_promotor_id:S.pid,p_client_uuid:crypto.randomUUID(),p_base_id:h.base_id,p_accion:acc,p_pin:S.pin||null,
      p_serie_fisica:v('#sf')||null,p_nro_activo:v('#na')||null,p_motivo_id:v('#mo')?+v('#mo'):null,p_observacion:v('#ob')||null});
      s.remove();
      if(!r.queued){const al=(r.alertas||[]).map(a=>ALERTA[a]||a).join(' ');
        toast((r.resultado==='OK'?'✅ Coincide: OK':r.resultado==='SERIE_DISTINTA'?'⚠️ La serie no coincide con la base':r.resultado==='SIN_CONFIRMAR'?'Guardado. La serie de la base no era confiable':'Guardado')+(al?' — '+al:''),6000)}
      ficha(cod)}
    catch(er){btn.disabled=false;e.textContent=ERR[er.message]||er.message;if(er.message==='ACCESO_INVALIDO')fail(er)}}}

function hallazgo(cod,cliente){
  const s=sheet(`<h2>Heladera que no figura en la base</h2><div class="mut">${esc(cliente)}</div>
  <label for="mk">Marca</label><input id="mk"><label for="sf">Serie</label><input id="sf" autocapitalize="characters" autocomplete="off">
  <label for="na">N° de activo</label><input id="na" autocapitalize="characters" autocomplete="off">
  <label for="ob">Observación (opcional)</label><textarea id="ob" rows="2"></textarea><div class="err" id="e"></div>
  <button id="sv">Guardar</button><button class="sec" id="cx" style="margin-top:8px">Cancelar</button>`);
  s.querySelector('#cx').onclick=()=>s.remove();
  s.querySelector('#sv').onclick=async()=>{const v=id=>s.querySelector(id).value.trim(),e=s.querySelector('#e');
    if(!v('#sf'))return e.textContent=ERR.FALTA_SERIE_FISICA;if(!v('#na'))return e.textContent=ERR.FALTA_NRO_ACTIVO;
    try{const r=await send('app_registrar_hallazgo',{p_acceso:S.acc,p_promotor_id:S.pid,p_client_uuid:crypto.randomUUID(),p_cod_cliente:cod,
      p_serie_fisica:v('#sf'),p_nro_activo:v('#na'),p_pin:S.pin||null,p_marca:v('#mk')||null,p_observacion:v('#ob')||null});
      s.remove();if(!r.queued)toast('Heladera registrada'+((r.alertas||[]).length?' — '+r.alertas.map(a=>ALERTA[a]||a).join(' '):''),6000)}
    catch(er){e.textContent=ERR[er.message]||er.message}}}

noCfg()?setup():S.acc&&S.pid?home():login();
</script></body></html>
